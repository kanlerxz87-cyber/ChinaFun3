name: Verify static dashboard
on:
  push:
    branches: ['arena/8725551a-chinafun3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate schema, row evidence, internal links and calendar
        run: python3 -m unittest discover -s tests -v
      - name: Validate browser script syntax
        run: node --check assets/app.js
      - name: Generated pages must match source
        run: git diff --exit-code -- '*.html'
